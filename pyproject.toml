[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapy-gpx-exporter"
version = "0.1.0"
description = "Export GPX files from mapy.com route planner share links, single or in batch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pea" }]
keywords = ["mapy.cz", "mapy.com", "gpx", "cycling", "route-planning"]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
frpc = [
    "pyfrpc>=0.2.14",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyfrpc>=0.2.14",
    "anyio>=4.0",  # pytest-anyio plugin used by @pytest.mark.anyio in test_client.py
]

[project.scripts]
mapy-gpx = "mapy_gpx_exporter.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument()/typer.Option() as default values is the documented,
# required pattern for Typer's CLI signature introspection.
"src/mapy_gpx_exporter/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/diamond447/mapy-gpx-exporter"
Repository = "https://github.com/diamond447/mapy-gpx-exporter"
Issues = "https://github.com/diamond447/mapy-gpx-exporter/issues"
